<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/toast.css">
</head>

<body>

<div class="dashboard-container">

    <div class="dashboard-header">

        <div>
            <h1>Leave Management System</h1>
        </div>

        <div class="user-section">

            <span class="user-name" id="userName">
                Loading...
            </span>

            <a class="header-logout" href="#" id="logoutButton">
                Logout
            </a>

        </div>

    </div>


    <div class="dashboard-grid">

        <div class="employee-card">

            <h2>Profile</h2>

            <div class="employee-details">

                <div class="detail-item">
                    <span>Employee ID</span>
                    <strong id="employeeId"></strong>
                </div>

                <div class="detail-item">
                    <span>Designation</span>
                    <strong id="designation"></strong>
                </div>

                <div class="detail-item">
                    <span>Name</span>
                    <strong id="employeeName"></strong>
                </div>

            </div>

        </div>


        <div class="actions-card">

            <h2>Quick Actions</h2>

            <div class="action-grid">

                <a href="request-leave.html">
                    Request Leave
                </a>

                <a href="leave-history.html">
                    Leave History
                </a>

                <div id="managerActions" style="display: contents;">

                    <a href="approve-leave.html">
                        Approve Leave
                    </a>

                    <a href="/generateReport">
                        Generate Report
                    </a>

                    <a href="revoke-leave.html">
                        Revoke Leave
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="../js/toast.js"></script>
<script src="../js/dashboard.js"></script>

</body>

</html>
